<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 36" fill="none">
  <!-- Isotipo: Rosa de los vientos / Cruz geométrica contemporánea de NORTE Studio -->
  <g fill="currentColor">
    <!-- Eje vertical norte con acento agudo -->
    <path d="M16 2 L20 14 L16 12 L12 14 Z"/>
    <path d="M16 30 L20 18 L16 20 L12 18 Z"/>
    <!-- Eje horizontal -->
    <path d="M2 16 L14 12 L12 16 L14 20 Z"/>
    <path d="M30 16 L18 12 L20 16 L18 20 Z"/>
    <!-- Centro geométrico -->
    <circle cx="16" cy="16" r="2.2"/>
  </g>
  <!-- Tipografía de marca: NORTE STUDIO con espaciado amplio -->
  <text x="44" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.28em" fill="currentColor">
    NORTE
  </text>
  <text x="132" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="9" font-weight="400" letter-spacing="0.35em" fill="currentColor" opacity="0.65">
    STUDIO
  </text>
</svg>
