{# templates/partials/search_overlay.html #}
{# Propósito: Overlay modal de búsqueda en vivo con debounce y navegación por teclado #}

<div
  id="search-modal"
  class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-300 ease-editorial"
  aria-hidden="true"
  role="dialog"
  aria-modal="true"
  aria-labelledby="search-modal-title"
>
  <!-- Backdrop oscuro -->
  <div data-search-backdrop class="absolute inset-0 bg-dark/70 backdrop-blur-md transition-opacity"></div>

  <!-- Contenedor del Modal Centrado / Superior -->
  <div class="fixed inset-x-0 top-0 max-w-3xl mx-auto p-4 sm:p-6 z-10">
    <div
      data-search-panel
      class="bg-bone border border-bone-dark shadow-2xl overflow-hidden transform -translate-y-4 transition-transform duration-300 ease-editorial"
    >
      <!-- Cabecera del Buscador -->
      <div class="p-4 sm:p-6 border-b border-bone-dark flex items-center justify-between">
        <h2 id="search-modal-title" class="text-xs font-bold uppercase tracking-wider-label text-dark">
          Búsqueda de Catálogo
        </h2>
        <button
          type="button"
          data-search-close
          class="p-2 text-dark hover:text-dark-muted min-w-[44px] min-h-[44px] flex items-center justify-center -mr-2"
          aria-label="Cerrar buscador"
        >
          <svg class="w-5 h-5 stroke-current" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Input de Búsqueda Grande -->
      <div class="p-4 sm:p-6 border-b border-bone-dark bg-bone-light">
        <div class="relative flex items-center">
          <svg class="w-5 h-5 text-dark-muted absolute left-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
          </svg>
          <input
            id="search-modal-input"
            type="search"
            placeholder="Buscar por prenda, gramaje o color (ej: 'Hoodie 450 GSM', 'Chocolate')..."
            autocomplete="off"
            class="w-full bg-bone pl-12 pr-4 py-3.5 text-sm sm:text-base text-dark placeholder-dark-muted/60 border border-bone-dark focus:border-dark focus:ring-0 focus:outline-none rounded-none"
          >
        </div>

        <!-- Atajos de Categoría Rápida -->
        <div class="flex items-center space-x-2 pt-3 text-[11px] font-mono text-dark-muted overflow-x-auto">
          <span>Sugerencias:</span>
          <a href="{% url 'catalog:category_detail' category_slug='hoodies' %}" class="underline hover:text-dark">Hoodies</a>
          <span>•</span>
          <a href="{% url 'catalog:category_detail' category_slug='poleras' %}" class="underline hover:text-dark">Poleras Boxy</a>
          <span>•</span>
          <a href="{% url 'catalog:category_detail' category_slug='pantalones' %}" class="underline hover:text-dark">Pantalones Baggy</a>
          <span>•</span>
          <a href="{% url 'catalog:category_detail' category_slug='knits' %}" class="underline hover:text-dark">Knits</a>
        </div>
      </div>

      <!-- Contador de Resultados -->
      <div id="search-results-count" class="px-6 py-2 bg-bone text-[11px] font-mono text-dark-muted border-b border-bone-dark empty:hidden"></div>

      <!-- Contenedor Dinámico de Resultados -->
      <div id="search-results-container" class="max-h-96 overflow-y-auto p-4 sm:p-6 divide-y divide-bone-dark">
        <div class="py-12 text-center text-xs text-dark-muted uppercase tracking-wider-label">
          Comienza a escribir para descubrir prendas streetwear...
        </div>
      </div>

    </div>
  </div>
</div>
